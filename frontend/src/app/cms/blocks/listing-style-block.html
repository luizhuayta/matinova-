<div class="listing-page">
  @switch (block().type) {
    @case ('listingHero') {
      <app-page-header align="center" [background]="headerBackground()" [eyebrow]="headerEyebrow()">
        @if (editor.editMode()) {
          <h1 page-title class="cyber-page-header__title" [cmsText]="path('title')"></h1>
        } @else {
          <h1 page-title class="cyber-page-header__title">
            @for (part of titleParts(); track $index) {
              <span [class.cyber-gradient-text]="part.accent">{{ part.text }}</span>
            }
          </h1>
        }
        <p page-text class="cyber-page-header__text" [cmsText]="path('text')"></p>
      </app-page-header>
    }
    @case ('serviceCards') {
      <section class="premium-section cyber-services">
        <div class="container">
          <app-hud-divider />
          <div class="premium-head premium-head--split" appReveal>
            <h2 [cmsText]="path('title')"></h2>
          </div>
          <div class="cyber-services-grid" [cmsList]="path('cards')">
            @for (card of cards(); track $index) {
              <app-service-photo-card class="service-card" appReveal [delay]="($index * 70) + 'ms'"
                [field]="path('cards.' + $index)"
                [image]="card['img'] || ''"
                [title]="card['title'] || ''"
                [icon]="iconOf(card, $index)"
                [href]="cardHref(card)"
                [linkLabel]="cardLabel(card)"
                linkField="path"
                [editableLabel]="true" />
            }
          </div>
        </div>
      </section>
    }
    @case ('cta') {
      <section class="cta-bay cyber-cta studio-dark">
        <div class="container" appReveal>
          <h2 [cmsText]="path('title')"></h2>
          <p [cmsText]="path('text')"></p>
          <app-glow-button [href]="editor.editMode() ? '' : ctaHref()" [label]="ctaLabel()" [cmsLink]="path('link')" />
        </div>
      </section>
    }
  }
</div>
