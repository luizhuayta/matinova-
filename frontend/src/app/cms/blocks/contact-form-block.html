<div class="form-shell">
  <app-hud-divider />
  <app-cyber-card tone="elevated">
    <form (ngSubmit)="enviar()">
      @if (show('name') || show('email')) {
        <div class="form-row">
          @if (show('name')) {
            <label>
              Nombre
              <input type="text" [placeholder]="placeholders()['name'] || 'Su nombre'" [(ngModel)]="nombre" name="nombre" required autocomplete="name">
            </label>
          }
          @if (show('email')) {
            <label>
              Correo
              <input type="email" [placeholder]="placeholders()['email'] || 'Su correo'" [(ngModel)]="email" name="email" required autocomplete="email">
            </label>
          }
        </div>
      }
      @if (show('phone')) {
        <label>
          Teléfono
          <input type="tel" [placeholder]="placeholders()['phone'] || 'Teléfono'" [(ngModel)]="telefono" name="telefono" maxlength="9" autocomplete="tel" inputmode="numeric">
        </label>
      }
      @if (show('subject')) {
        <label>
          Asunto
          <input type="text" [placeholder]="placeholders()['subject'] || 'Asunto'" [(ngModel)]="asunto" name="asunto" required>
        </label>
      }
      @if (show('message')) {
        <label>
          Mensaje
          <textarea [placeholder]="placeholders()['message'] || 'Mensaje'" [(ngModel)]="mensaje" name="mensaje" required rows="5"></textarea>
        </label>
      }
      <app-glow-button type="submit" [disabled]="isLoading" [label]="submitLabel()"></app-glow-button>
    </form>
  </app-cyber-card>
</div>
