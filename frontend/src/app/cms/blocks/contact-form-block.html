<div class="form-shell">
  <app-hud-divider />
  <app-cyber-card tone="elevated">
    <form (ngSubmit)="enviar()">
      @if (show('name') || show('email')) {
        <div class="form-row">
          @if (show('name')) {
            <label>
              {{ isEn() ? 'Name' : 'Nombre' }}
              <input type="text" [placeholder]="placeholders()['name'] || (isEn() ? 'Your name' : 'Su nombre')" [(ngModel)]="nombre" name="nombre" required autocomplete="name">
            </label>
          }
          @if (show('email')) {
            <label>
              {{ isEn() ? 'Email' : 'Correo' }}
              <input type="email" [placeholder]="placeholders()['email'] || (isEn() ? 'Your email' : 'Su correo')" [(ngModel)]="email" name="email" required autocomplete="email">
            </label>
          }
        </div>
      }
      @if (show('phone')) {
        <label>
          {{ isEn() ? 'Phone' : 'Teléfono' }}
          <input type="tel" [placeholder]="placeholders()['phone'] || (isEn() ? 'Phone' : 'Teléfono')" [(ngModel)]="telefono" name="telefono" maxlength="9" autocomplete="tel" inputmode="numeric">
        </label>
      }
      @if (show('subject')) {
        <label>
          {{ isEn() ? 'Subject' : 'Asunto' }}
          <input type="text" [placeholder]="placeholders()['subject'] || (isEn() ? 'Subject' : 'Asunto')" [(ngModel)]="asunto" name="asunto" required>
        </label>
      }
      @if (show('message')) {
        <label>
          {{ isEn() ? 'Message' : 'Mensaje' }}
          <textarea [placeholder]="placeholders()['message'] || (isEn() ? 'Message' : 'Mensaje')" [(ngModel)]="mensaje" name="mensaje" required rows="5"></textarea>
        </label>
      }
      <app-glow-button type="submit" [disabled]="isLoading" [label]="submitLabel()"></app-glow-button>
    </form>
  </app-cyber-card>
</div>
