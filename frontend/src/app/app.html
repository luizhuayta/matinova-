@if (isAdmin()) {
  <router-outlet></router-outlet>
} @else {
  <div class="public-theme">
    <app-skip-link />
    <app-header></app-header>
    <app-site-chrome />
    <main id="contenido" class="public-main">
      <router-outlet></router-outlet>
    </main>
    <app-footer></app-footer>
    @if (showChat()) {
      @defer (on idle) {
        <app-chatbot></app-chatbot>
      }
    }
    @if (showWhatsapp()) {
      @defer (on idle) {
        <app-whatsapp-bubble></app-whatsapp-bubble>
      }
    }
    @defer (on idle) {
      <app-accessibility></app-accessibility>
    }
  </div>
}
