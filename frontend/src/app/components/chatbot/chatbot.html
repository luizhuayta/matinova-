<!-- Botón flotante -->
<button
  type="button"
  class="chat-fab"
  #chatFab
  (click)="toggleChat()"
  *ngIf="!isOpen"
  [attr.aria-label]="isEn() ? 'Open MIS-Bot assistant' : 'Abrir asistente MIS-Bot'"
>
  <img [src]="siteLogo()" alt="" (error)="onImgError($event)" width="28" height="28" />
  <span class="fab-dot" *ngIf="!hasInteracted" aria-hidden="true">1</span>
</button>

<!-- Ventana de chat -->
<div class="chat-window" [class.open]="isOpen" role="dialog" aria-modal="true" [attr.aria-label]="isEn() ? 'MIS-Bot assistant' : 'Asistente MIS-Bot'" [attr.aria-hidden]="!isOpen" (keydown.escape)="closeFromKeyboard()">
  <!-- Cabecera -->
  <div class="chat-header">
    <div class="bot-identity">
      <div class="bot-avatar">
        <img [src]="siteLogo()" alt="MIS" class="a11y-keep" (error)="onImgError($event)" />
        <span class="status-dot" aria-hidden="true"></span>
      </div>
      <div class="bot-meta">
        <strong>MIS-Bot</strong>
        <span class="bot-status">{{ isEn() ? 'Online · instant replies' : 'En línea · responde al instante' }}</span>
      </div>
    </div>
    <div class="header-actions">
      <button type="button" class="icon-btn" (click)="clearChat()" [title]="isEn() ? 'Clear conversation' : 'Limpiar conversación'" [attr.aria-label]="isEn() ? 'Clear conversation' : 'Limpiar conversación'">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
      </button>
      <button type="button" class="icon-btn close" (click)="toggleChat()" [title]="isEn() ? 'Close' : 'Cerrar'" [attr.aria-label]="isEn() ? 'Close chat' : 'Cerrar chat'">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <!-- Mensajes (única zona con scroll) -->
  <div class="chat-body" #scrollMe>
    <div
      *ngFor="let msg of messages; let i = index; trackBy: trackByIndex"
      class="message-row"
      [ngClass]="msg.type"
    >
      <div class="avatar" *ngIf="msg.type === 'bot'" aria-hidden="true">
        <img [src]="siteLogo()" alt="" (error)="onImgError($event)" />
      </div>

      <div class="bubble-wrapper">
        <div class="bubble" (click)="onBubbleClick($event)">
          <p [innerHTML]="formatText(msg.text)"></p>
        </div>
        <div class="bot-links" *ngIf="msg.type === 'bot' && msg.links?.length">
          <button
            type="button"
            *ngFor="let link of msg.links"
            (click)="navigateTo(link.path)"
            class="bot-link"
          >
            <span class="link-label">{{ link.label }}</span>
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg>
          </button>
        </div>
        <div class="feedback" *ngIf="msg.type === 'bot' && msg.showFeedback && !msg.feedback">
          <span>{{ isEn() ? 'Was this helpful?' : '¿Te sirvió?' }}</span>
          <button type="button" class="feedback-btn" (click)="rateMessage(i, 'up')" [attr.aria-label]="isEn() ? 'Helpful response' : 'Respuesta útil'"><i class="bi bi-hand-thumbs-up"></i></button>
          <button type="button" class="feedback-btn" (click)="rateMessage(i, 'down')" [attr.aria-label]="isEn() ? 'Not helpful response' : 'Respuesta poco útil'"><i class="bi bi-hand-thumbs-down"></i></button>
        </div>
        <p class="feedback-done" *ngIf="msg.feedback">{{ isEn() ? 'Thanks for the feedback' : 'Gracias por el comentario' }}</p>
      </div>
    </div>

    <!-- Escribiendo... -->
    <div class="message-row bot" *ngIf="isTyping" aria-live="polite">
      <div class="avatar" aria-hidden="true">
        <img [src]="siteLogo()" alt="" (error)="onImgError($event)" />
      </div>
      <div class="bubble-wrapper">
        <div class="bubble typing">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Sugerencias (fuera del scroll, no empuja mensajes) -->
  <div class="suggestions" *ngIf="!hasUserMessage && !isTyping">
    <span class="suggestions-label">{{ isEn() ? 'Try asking:' : 'Prueba con:' }}</span>
    <div class="suggestions-row">
      <button
        type="button"
        class="suggestion-chip"
        *ngFor="let suggestion of suggestions()"
        (click)="selectSuggestion(suggestion)"
      >
        {{ suggestion }}
      </button>
    </div>
  </div>

  <!-- Entrada -->
  <form class="chat-footer" (submit)="onEnter($event)">
    <input
      #chatInput
      [(ngModel)]="userInput"
      name="userInput"
      [placeholder]="isEn() ? 'Write your technical question...' : 'Escribe tu duda técnica...'"
      type="text"
      autocomplete="off"
      maxlength="500"
      [attr.aria-label]="isEn() ? 'Write your message' : 'Escribe tu mensaje'"
    />
    <button type="submit" [disabled]="!canSend" [attr.aria-label]="isEn() ? 'Send message' : 'Enviar mensaje'" [title]="isEn() ? 'Send' : 'Enviar'">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
    </button>
  </form>
</div>
