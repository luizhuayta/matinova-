<footer class="footer studio-dark">
  <div class="footer-grid">
    <div class="footer-col">
      <img src="logo.svg" [src]="site()['logo'] || 'logo.svg'" [alt]="site()['logoAlt'] || 'Matt Innova Solution'" class="footer-logo" cmsImage="logo" cmsScope="site">
      <p class="footer-desc" cmsText="footer.desc" cmsScope="site"></p>
      <div class="social-links">
        @if (live(footer()['youtube'])) {
          <a [href]="footer()['youtube']" target="_blank" rel="noopener noreferrer" aria-label="YouTube" cmsLink="footer.youtube" cmsScope="site">
            <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M23 7.5s-.2-1.6-.9-2.3c-.8-.9-1.7-.9-2.1-1C17.2 4 12 4 12 4s-5.2 0-8 .2c-.4 0-1.3.1-2.1 1C1.2 5.9 1 7.5 1 7.5S.8 9.4.8 11.3v1.4c0 1.9.2 3.8.2 3.8s.2 1.6.9 2.3c.8.9 1.9.8 2.4.9 1.8.2 7.7.2 7.7.2s5.2 0 8-.2c.4 0 1.3-.1 2.1-1 .7-.7.9-2.3.9-2.3s.2-1.9.2-3.8v-1.4c0-1.9-.2-3.8-.2-3.8ZM9.8 14.6V8.4l6.3 3.1-6.3 3.1Z"/></svg>
          </a>
        }
        @if (live(footer()['facebook'])) {
          <a [href]="footer()['facebook']" target="_blank" rel="noopener noreferrer" aria-label="Facebook" cmsLink="footer.facebook" cmsScope="site">
            <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M14 9h3V6h-3c-2.2 0-4 1.8-4 4v2H8v3h2v7h3v-7h3l1-3h-4v-2c0-.6.4-1 1-1Z"/></svg>
          </a>
        }
        @if (live(footer()['linkedin'])) {
          <a [href]="footer()['linkedin']" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn" cmsLink="footer.linkedin" cmsScope="site">
            <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24"><path fill="currentColor" d="M6.5 9H3.7v12h2.8V9ZM5.1 3.5A1.8 1.8 0 1 0 5.1 7a1.8 1.8 0 0 0 0-3.5ZM20.3 21h-2.8v-6.4c0-1.8-.8-2.4-1.8-2.4s-2 .9-2 2.5V21h-2.8V9h2.7v1.6c.5-.9 1.8-1.9 3.6-1.9 2.3 0 4.1 1.5 4.1 4.7V21Z"/></svg>
          </a>
        }
        @if (live(footer()['instagram'])) {
          <a [href]="footer()['instagram']" target="_blank" rel="noopener noreferrer" aria-label="Instagram" cmsLink="footer.instagram" cmsScope="site">
            <svg class="ui-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3.5" y="3.5" width="17" height="17" rx="4"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"/></svg>
          </a>
        }
      </div>
    </div>
    <div class="footer-col">
      <h3 cmsText="footer.quickTitle" cmsScope="site"></h3>
      <ul>
        <li><a [routerLink]="pathOf('/')"><span cmsText="nav.inicio" cmsScope="site"></span></a></li>
        <li><a [routerLink]="pathOf('/acerca-de')"><span cmsText="nav.acerca" cmsScope="site"></span></a></li>
        <li><a [routerLink]="pathOf('/servicios')"><span cmsText="nav.servicios" cmsScope="site"></span></a></li>
        @if (live(nav()['academyUrl'])) {
          <li>
            <a [href]="nav()['academyUrl']" target="_blank" rel="noopener noreferrer" cmsLink="nav.academyUrl" cmsScope="site"><span cmsText="nav.academy" cmsScope="site"></span></a>
          </li>
        }
        <li><a [routerLink]="pathOf('/contacto')"><span cmsText="nav.contacto" cmsScope="site"></span></a></li>
      </ul>
    </div>
    <div class="footer-col">
      <h3 cmsText="footer.popularTitle" cmsScope="site"></h3>
      <ul>
        <li *ngFor="let item of navServices(); let i = index">
          <a [routerLink]="pathOf(item['path'])"><span [cmsText]="'navServices.' + i + '.label'" cmsScope="site"></span></a>
        </li>
      </ul>
    </div>
    <div class="footer-col">
      <h3 cmsText="footer.contactTitle" cmsScope="site"></h3>
      <p class="tagline" cmsText="footer.tagline" cmsScope="site"></p>
      <ul class="contact-info">
        <li>
          <span class="contact-icon" aria-hidden="true">
            <svg class="ui-icon ui-icon--sm"><use href="assets/icons/ui.svg#map-pin"></use></svg>
          </span>
          <span cmsText="footer.address" cmsScope="site"></span>
        </li>
        <li>
          <span class="contact-icon" aria-hidden="true">
            <svg class="ui-icon ui-icon--sm"><use href="assets/icons/ui.svg#phone"></use></svg>
          </span>
          <span cmsText="footer.phone" cmsScope="site"></span>
        </li>
        <li>
          <span class="contact-icon" aria-hidden="true">
            <svg class="ui-icon ui-icon--sm"><use href="assets/icons/ui.svg#mail"></use></svg>
          </span>
          <span cmsText="footer.email" cmsScope="site"></span>
        </li>
        <li>
          <a
            [routerLink]="pathOf('/libro-reclamaciones')"
            class="libro-link"
            [attr.aria-label]="locales.locale() === 'en' ? 'Claims book — INDECOPI, Law 29571' : 'Libro de reclamaciones — INDECOPI, Ley 29571'">
            <span class="libro-icon" aria-hidden="true">
              <svg class="ui-icon"><use href="assets/icons/ui.svg#book"></use></svg>
            </span>
            <img src="libro.jpg" [src]="footer()['libroImage'] || 'libro.jpg'" alt="" class="libro-image" cmsImage="footer.libroImage" cmsScope="site" width="48" height="48">
            <span>{{ locales.locale() === 'en' ? 'Claims book' : 'Libro de reclamaciones' }}</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
  <div class="footer-bottom">
    <p cmsText="footer.copyright" cmsScope="site"></p>
    <div class="legal-links">
      <a [routerLink]="pathOf('/privacidad')" cmsText="footer.privacy" cmsScope="site"></a>
      <a [routerLink]="pathOf('/terminos')" cmsText="footer.terms" cmsScope="site"></a>
      <a routerLink="/admin">Admin</a>
    </div>
  </div>
</footer>
