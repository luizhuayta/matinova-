<div class="top-bar"></div>

<header class="main-header">
  <div class="navbar">
    <div class="logo-container">
      <a routerLink="/">
        <img src="logo.svg" alt="Matt Innova Solution" class="logo-img" [class.logo-entrance]="logoClass">
      </a>
    </div>

    <button class="mobile-menu-toggle" (click)="toggleMobileMenu()" [class.active]="isMobileMenuOpen" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav class="nav" [class.mobile-open]="isMobileMenuOpen">
      <ul class="nav-list">
        <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" (click)="navigateTo('/')">Inicio</a></li>
        <li><a routerLink="/acerca-de" routerLinkActive="active" (click)="navigateTo('/acerca-de')">Acerca de</a></li>
        <li><a href="https://misacademyonline.com/" target="_blank" rel="noopener noreferrer">MIS Academy</a></li>

        <li class="dropdown">
          <a class="dropbtn">Servicios <i class="bi bi-caret-down-fill"></i></a>
          <div class="dropdown-content">
            <a routerLink="/servicios/saas" (click)="navigateTo('/servicios/saas')">SAAS</a>
            <a routerLink="/servicios/hardware" (click)="navigateTo('/servicios/hardware')">Hardware</a>
            <a routerLink="/servicios/software" (click)="navigateTo('/servicios/software')">Software</a>
            <a routerLink="/servicios/consultoria" (click)="navigateTo('/servicios/consultoria')">Consultoría</a>
            <a routerLink="/servicios/soluciones-ti" (click)="navigateTo('/servicios/soluciones-ti')">Soluciones TI</a>
          </div>
        </li>

        <li><a routerLink="/contacto" routerLinkActive="active" (click)="navigateTo('/contacto')">Contacto</a></li>
        <li><a (click)="toggleTransparency()" class="btn-transparencia">Clientes</a></li>
      </ul>
    </nav>
  </div>
</header>
