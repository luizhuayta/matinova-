<div class="acerca-container">
  <section class="about-hero">
    <div class="hero-overlay">
      <div class="container hero-content">
        <span class="hero-badge" cmsText="heroBadge"></span>
        <h1 cmsText="heroTitle"></h1>
        <p cmsText="heroText"></p>
        <button class="btn-hero" routerLink="/contacto" cmsText="heroCta"></button>
      </div>
    </div>
  </section>

  <section class="stats-section">
    <div class="container">
      <div class="stats-grid">
        <div class="stat-card" *ngFor="let stat of stats(); let i = index">
          <div class="stat-icon" [cmsText]="'stats.' + i + '.icon'"></div>
          <div class="stat-number" [cmsText]="'stats.' + i + '.number'"></div>
          <div class="stat-label" [cmsText]="'stats.' + i + '.label'"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="about-section">
    <div class="container">
      <div class="about-content">
        <div class="about-image">
          <img [src]="page()['aboutImage'] || 'about-image.jpg'" alt="Equipo MIS trabajando" cmsImage="aboutImage">
        </div>
        <div class="about-text">
          <span class="section-tag" cmsText="aboutTag"></span>
          <h2 cmsText="aboutTitle"></h2>
          <p cmsText="aboutText"></p>
          <div class="features-list">
            <div class="feature-item" *ngFor="let feature of features(); let i = index">
              <span class="feature-icon">✓</span>
              <span [cmsText]="'features.' + i"></span>
            </div>
          </div>
          <button class="btn-primary" routerLink="/contacto" cmsText="aboutCta"></button>
        </div>
      </div>
    </div>
  </section>

  <section class="team-section">
    <div class="container">
      <div class="section-header">
        <span class="section-tag" cmsText="teamTag"></span>
        <h2 cmsText="teamTitle"></h2>
        <p cmsText="teamText"></p>
      </div>
      <div class="team-grid">
        <div class="team-card" *ngFor="let member of team(); let i = index">
          <div class="team-image">
            <img [src]="member['image']" [alt]="member['name']" [cmsImage]="'team.' + i + '.image'">
          </div>
          <div class="team-info">
            <h3 [cmsText]="'team.' + i + '.name'"></h3>
            <p class="team-role" [cmsText]="'team.' + i + '.role'"></p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="contact-info-section">
    <div class="container">
      <div class="contact-info-grid">
        <div class="contact-info-card" *ngFor="let card of contactCards(); let i = index">
          <div class="contact-icon"><i class="bi bi-geo-alt-fill"></i></div>
          <h3 [cmsText]="'contactCards.' + i + '.title'"></h3>
          <p [cmsText]="'contactCards.' + i + '.text'"></p>
        </div>
      </div>
    </div>
  </section>

  <section class="youtube-section">
    <div class="container">
      <div class="section-header">
        <span class="section-tag" cmsText="videosTag"></span>
        <h2 cmsText="videosTitle"></h2>
        <p cmsText="videosText"></p>
      </div>
      <div class="videos-grid">
        <div class="video-card" *ngFor="let video of videos(); let i = index">
          <div class="video-wrapper">
            <iframe [src]="embed(video['embed'])" title="YouTube" allowfullscreen></iframe>
          </div>
          <div class="video-info">
            <div class="video-user" [cmsText]="'videos.' + i + '.user'"></div>
            <div class="video-title" [cmsText]="'videos.' + i + '.title'"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
