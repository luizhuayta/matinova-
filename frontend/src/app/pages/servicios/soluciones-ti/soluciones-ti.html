<main class="solucionesPage">
  <section class="hero">
    <img [src]="ctx.page()['heroImage']" [alt]="ctx.page()['heroAlt'] || ''" class="heroImage" cmsImage="heroImage">
  </section>
  <section class="info-section">
    <div class="info-container">
      <div class="info-imagen">
        <img [src]="ctx.page()['image']" [alt]="ctx.page()['imageAlt'] || ''" cmsImage="image">
      </div>
      <div class="info-texto">
        <span class="badge" cmsText="label"></span>
        <h2 cmsText="title"></h2>
        <p cmsText="text"></p>
        <a routerLink="/contacto" class="btn-contacto" cmsText="cta"></a>
      </div>
    </div>
  </section>
  <section class="razones-section">
    <div class="razones-container">
      <span class="badge-razones" cmsText="reasonsSubtitle"></span>
      <h2 cmsText="reasonsTitle"></h2>
      <div class="razones-grid">
        <div class="razon-card" *ngFor="let reason of ctx.reasons(); let i = index">
          <img [src]="reason['img']" [alt]="reason['title']" [cmsImage]="'reasons.' + i + '.img'">
          <h3 [cmsText]="'reasons.' + i + '.title'"></h3>
          <p [cmsText]="'reasons.' + i + '.text'"></p>
        </div>
      </div>
    </div>
  </section>
</main>
