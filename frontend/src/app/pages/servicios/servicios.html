<main class="serviciosPage">
  <section class="hero">
    <img [src]="ctx.page()['heroImage'] || '/carousel.jpg'" [alt]="ctx.page()['heroTitle'] || 'Servicios'" class="heroImage" cmsImage="heroImage">
    <div class="heroOverlay">
      <h1 cmsText="heroTitle"></h1>
      <p cmsText="heroText"></p>
    </div>
  </section>

  <section class="servicesGrid">
    <div class="container">
      <div class="servicesHeader">
        <p class="servicesSubtitle" cmsText="subtitle"></p>
        <h2 class="servicesTitle" cmsText="title"></h2>
      </div>
      <div class="servicesCards">
        <div class="serviceCard" *ngFor="let card of ctx.cards(); let i = index" [routerLink]="[card['path']]">
          <div class="card-image-wrapper">
            <img [src]="card['img']" [alt]="card['title']" [cmsImage]="'cards.' + i + '.img'">
          </div>
          <div class="card-body">
            <h3 [cmsText]="'cards.' + i + '.title'"></h3>
            <p [cmsText]="'cards.' + i + '.text'"></p>
            <a class="serviceLink" [routerLink]="[card['path']]" [cmsText]="'cards.' + i + '.link'"></a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="ctaSection">
    <div class="container">
      <div class="ctaContent">
        <h2 cmsText="ctaTitle"></h2>
        <p cmsText="ctaText"></p>
        <a routerLink="/contacto" class="ctaBtn" cmsText="ctaButton"></a>
      </div>
    </div>
  </section>
</main>
