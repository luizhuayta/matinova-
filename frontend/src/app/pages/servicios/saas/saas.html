<main class="softwarePage">
  <section class="hero">
    <img [src]="ctx.page()['heroImage']" [alt]="ctx.page()['heroAlt'] || ''" class="heroImage" cmsImage="heroImage">
  </section>
  <section class="reasons">
    <div class="container">
      <div class="serviceContent">
        <div>
          <img [src]="ctx.page()['image']" [alt]="ctx.page()['imageAlt'] || ''" class="serviceImage" cmsImage="image">
        </div>
        <div class="serviceRight">
          <div class="serviceLabel" cmsText="label"></div>
          <h2 cmsText="title"></h2>
          <p cmsText="text"></p>
          <a routerLink="/contacto" class="contactBtn" cmsText="cta"></a>
        </div>
      </div>
    </div>
  </section>
  <section class="reasonsToChoose">
    <div class="container">
      <div class="reasonsHeader">
        <p class="reasonsSubtitle" cmsText="reasonsSubtitle"></p>
        <h2 class="reasonsTitle" cmsText="reasonsTitle"></h2>
      </div>
      <div class="reasonsCards">
        <div class="reasonCard" *ngFor="let reason of ctx.reasons(); let i = index">
          <img [src]="reason['img']" [alt]="reason['title']" [cmsImage]="'reasons.' + i + '.img'">
          <h3 [cmsText]="'reasons.' + i + '.title'"></h3>
          <p [cmsText]="'reasons.' + i + '.text'"></p>
        </div>
      </div>
    </div>
  </section>
</main>
