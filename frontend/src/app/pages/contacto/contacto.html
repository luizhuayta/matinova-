<div class="contacto-container">
  <div class="info">
    <span class="badge" cmsText="badge"></span>
    <h2 cmsText="title"></h2>
    <div class="card" *ngFor="let card of cards(); let i = index">
      <div class="icon"><i class="bi bi-geo-alt"></i></div>
      <div>
        <h4 [cmsText]="'cards.' + i + '.title'"></h4>
        <p [cmsText]="'cards.' + i + '.text'"></p>
      </div>
    </div>
  </div>

  <div class="formulario">
    <form (ngSubmit)="enviar()">
      @if (show('name') || show('email')) {
        <div class="fila">
          @if (show('name')) {
            <input type="text" [placeholder]="placeholders()['name'] || 'Su nombre'" [(ngModel)]="nombre" name="nombre" required>
          }
          @if (show('email')) {
            <input type="email" [placeholder]="placeholders()['email'] || 'Su correo'" [(ngModel)]="email" name="email" required>
          }
        </div>
      }
      @if (show('phone')) {
        <div class="fila">
          <input type="tel" [placeholder]="placeholders()['phone'] || 'Teléfono'" [(ngModel)]="telefono" name="telefono" maxlength="9">
        </div>
      }
      @if (show('subject')) {
        <input type="text" [placeholder]="placeholders()['subject'] || 'Asunto'" [(ngModel)]="asunto" name="asunto" required>
      }
      @if (show('message')) {
        <textarea [placeholder]="placeholders()['message'] || 'Mensaje'" [(ngModel)]="mensaje" name="mensaje" required></textarea>
      }
      <button type="submit" [disabled]="isLoading">{{ isLoading ? 'Enviando...' : (page()['submitLabel'] || 'Enviar Mensaje') }}</button>
    </form>
  </div>
</div>
