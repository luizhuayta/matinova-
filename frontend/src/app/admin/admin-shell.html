<div class="admin-shell">
  <aside class="admin-nav">
    <a routerLink="/admin" class="brand">
      <img src="logo.svg" alt="">
      <span>
        <strong>Matt Innova</strong>
        <small>Panel</small>
      </span>
    </a>
    <nav aria-label="Menú del panel">
      <a routerLink="/admin" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Inicio</a>
      <a routerLink="/admin/paginas" routerLinkActive="active">Páginas</a>
      <a routerLink="/admin/chatbot" routerLinkActive="active">Chatbot</a>
      <a routerLink="/admin/mensajes" routerLinkActive="active">Mensajes</a>
      <a routerLink="/admin/archivos" routerLinkActive="active">Imágenes</a>
      @if (auth.isAdmin()) {
        <a routerLink="/admin/usuarios" routerLinkActive="active">Usuarios</a>
        <a routerLink="/admin/webhooks" routerLinkActive="active">Webhooks</a>
      }
    </nav>
    <div class="nav-foot">
      <a class="site-link" href="/" target="_blank" rel="noopener">Ver la web</a>
      <div class="user">
        <span class="avatar" aria-hidden="true">{{ initial() }}</span>
        <div>
          <p>{{ auth.username() }}</p>
          <small>{{ auth.role() === 'editor' ? 'Editor' : 'Administrador' }}</small>
          <button type="button" (click)="auth.logout()">Salir</button>
        </div>
      </div>
    </div>
  </aside>
  <div class="admin-main">
    <router-outlet />
  </div>
</div>
